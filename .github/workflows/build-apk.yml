name: Build and upload Android APK

on:
  workflow_dispatch:
  push:
    branches: [stg, production]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_ENV: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Build release APK
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: ./gradlew assembleRelease --no-daemon --max-workers=2
        working-directory: android
      - name: Select artifact name
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" = "production" ]; then
            echo "APK_NAME=auto-trade-prd-v${VERSION}.apk" >> "$GITHUB_ENV"
            echo "DRIVE_SUBFOLDER=PRD" >> "$GITHUB_ENV"
          else
            echo "APK_NAME=auto-trade-stg-v${VERSION}.apk" >> "$GITHUB_ENV"
            echo "DRIVE_SUBFOLDER=STG" >> "$GITHUB_ENV"
          fi
      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Configure Google Drive
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.GDRIVE_RCLONE_CONFIG_BASE64 }}
        run: |
          test -n "$RCLONE_CONFIG_BASE64"
          mkdir -p "$HOME/.config/rclone"
          echo "$RCLONE_CONFIG_BASE64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
      - name: Upload APK to Google Drive
        env:
          DRIVE_FOLDER_ID: 10OYIyP7Qm4w0z4sZARcwcPHhSQxYWlML
        run: rclone copyto android/app/build/outputs/apk/release/app-release.apk "gdrive:${DRIVE_SUBFOLDER}/${APK_NAME}" --drive-root-folder-id "$DRIVE_FOLDER_ID"
